<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" class="fox-svg" role="img" aria-label="Kitsune Fox Mascot">
  <!-- Tail (Animated Wag) -->
  <g class="fox-tail">
    <path d="M 330 330 C 440 330, 450 460, 310 460 C 260 460, 220 440, 260 380 Z" fill="#d85025" stroke="#181816" stroke-width="12" stroke-linejoin="round" />
    <path d="M 310 460 C 270 460, 240 435, 260 380 C 285 410, 310 420, 335 440 Z" fill="#f4f4f5" stroke="#181816" stroke-width="10" stroke-linejoin="round" />
  </g>

  <!-- Body / Front Paws -->
  <path d="M 160 270 C 140 350, 140 430, 160 450 C 180 460, 200 460, 200 440 L 205 350 L 250 350 L 255 440 C 255 460, 275 460, 295 450 C 315 430, 320 350, 310 270 Z" fill="#d85025" stroke="#181816" stroke-width="12" stroke-linejoin="round" />

  <!-- Left Ear (Twitch Animation) -->
  <g class="fox-ear-left">
    <path d="M 140 140 L 180 40 C 205 55, 215 95, 210 145 Z" fill="#d85025" stroke="#181816" stroke-width="12" stroke-linejoin="round" />
    <path d="M 165 125 L 185 65 C 195 75, 200 95, 195 125 Z" fill="#fde68a" stroke="#181816" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Right Ear (Twitch Animation) -->
  <g class="fox-ear-right">
    <path d="M 360 140 L 320 40 C 295 55, 285 95, 290 145 Z" fill="#d85025" stroke="#181816" stroke-width="12" stroke-linejoin="round" />
    <path d="M 335 125 L 315 65 C 305 75, 300 95, 305 125 Z" fill="#fde68a" stroke="#181816" stroke-width="8" stroke-linejoin="round" />
  </g>

  <!-- Head Base -->
  <path d="M 120 205 C 120 100, 380 100, 380 205 C 395 240, 250 300, 250 300 C 250 300, 105 240, 120 205 Z" fill="#d85025" stroke="#181816" stroke-width="12" stroke-linejoin="round" />

  <!-- White Cheeks -->
  <path d="M 120 215 C 170 210, 230 250, 250 280 C 270 250, 330 210, 380 215 C 375 250, 320 285, 250 300 C 180 285, 125 250, 120 215 Z" fill="#ffffff" stroke="#181816" stroke-width="10" stroke-linejoin="round" />

  <!-- Left Eye (Blinking) -->
  <ellipse cx="205" cy="195" rx="12" ry="14" fill="#181816" class="fox-eye" />

  <!-- Right Eye (Blinking) -->
  <ellipse cx="295" cy="195" rx="12" ry="14" fill="#181816" class="fox-eye" />

  <!-- Nose -->
  <path d="M 238 250 Q 250 245 262 250 Q 250 275 238 250 Z" fill="#181816" />
</svg>
